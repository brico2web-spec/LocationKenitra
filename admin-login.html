<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f3">
  <title>دخول الإدارة — كراي ليا</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Tajawal:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#17231d; --muted:#758078; --green:#164b36; --lime:#c9ef74; --line:#e6ebe4; --red:#b54848; }
    * { box-sizing:border-box; }
    body { min-height:100vh; display:grid; place-items:center; margin:0; padding:24px; color:var(--ink); background:radial-gradient(ellipse at 15% 10%,#e8f0df 0,transparent 35%),#f5f7f3; font-family:"Tajawal",sans-serif; }
    button,input { font:inherit; }
    .card { width:min(440px,100%); padding:30px; border:1px solid var(--line); border-radius:20px; background:white; box-shadow:0 20px 70px rgba(25,49,33,.1); }
    .top { display:flex; align-items:center; justify-content:space-between; margin-bottom:25px; }
    .brand { display:flex; align-items:center; gap:11px; font-size:19px; font-weight:900; }
    .mark { display:grid; place-items:center; width:42px; height:42px; border-radius:14px; background:var(--lime); color:var(--green); }
    .language { border:1px solid var(--line); border-radius:9px; padding:7px 10px; background:white; color:var(--green); font-size:12px; font-weight:800; cursor:pointer; }
    h1 { margin:0 0 7px; font-size:25px; }
    .intro { margin:0 0 22px; color:var(--muted); font-size:14px; line-height:1.7; }
    .field { margin:0 0 15px; }
    label { display:block; margin-bottom:6px; font-size:13px; font-weight:800; }
    input { width:100%; min-height:45px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; outline:0; direction:ltr; text-align:left; }
    input:focus { border-color:#8ba482; box-shadow:0 0 0 3px rgba(112,145,98,.12); }
    .submit { width:100%; min-height:45px; border:0; border-radius:10px; background:var(--green); color:white; font-weight:800; cursor:pointer; }
    .submit:hover { background:#103a29; }
    .link { display:block; margin:16px auto 0; border:0; background:none; color:var(--green); text-align:center; font-size:13px; font-weight:800; cursor:pointer; }
    .message { min-height:20px; margin:14px 0 0; color:var(--muted); font-size:13px; line-height:1.6; }
    .message.error { color:var(--red); }
    [hidden] { display:none !important; }
    @media(max-width:480px) { .card { padding:23px 19px; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="top">
      <a class="brand" href="/"><span class="mark" aria-hidden="true">K</span><span>كراي ليا</span></a>
      <button class="language" id="languageToggle" type="button">Français</button>
    </div>
    <section id="loginView">
      <h1 data-ar="دخول لوحة الإدارة" data-fr="Connexion à l’administration">دخول لوحة الإدارة</h1>
      <p class="intro" data-ar="دخل معلومات الحساب باش تفتح لوحة التحكم." data-fr="Connectez-vous pour accéder au panneau d’administration.">دخل معلومات الحساب باش تفتح لوحة التحكم.</p>
      <form id="loginForm">
        <div class="field"><label for="username" data-ar="اسم المستخدم" data-fr="Nom d’utilisateur">اسم المستخدم</label><input id="username" name="username" autocomplete="username" required></div>
        <div class="field"><label for="password" data-ar="كلمة المرور" data-fr="Mot de passe">كلمة المرور</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
        <button class="submit" type="submit" data-ar="دخول" data-fr="Se connecter">دخول</button>
      </form>
      <button class="link" id="showRecovery" type="button" data-ar="نسيت كلمة المرور؟" data-fr="Mot de passe oublié ?">نسيت كلمة المرور؟</button>
    </section>
    <section id="recoveryView" hidden>
      <h1 data-ar="استرجاع كلمة المرور" data-fr="Récupération du mot de passe">استرجاع كلمة المرور</h1>
      <p class="intro" data-ar="أكد اسم المستخدم وكلمة الاسترجاع. غادي نصيفطو رابط التغيير لبريد الحساب." data-fr="Confirmez votre identifiant et votre phrase de récupération. Un lien sera envoyé à l’adresse du compte.">أكد اسم المستخدم وكلمة الاسترجاع. غادي نصيفطو رابط التغيير لبريد الحساب.</p>
      <form id="recoveryForm">
        <div class="field"><label for="recoveryUsername" data-ar="اسم المستخدم" data-fr="Nom d’utilisateur">اسم المستخدم</label><input id="recoveryUsername" name="username" autocomplete="username" required></div>
        <div class="field"><label for="recoveryWord" data-ar="كلمة الاسترجاع" data-fr="Phrase de récupération">كلمة الاسترجاع</label><input id="recoveryWord" name="recoveryWord" type="password" autocomplete="off" required></div>
        <button class="submit" type="submit" data-ar="صيفط رابط التغيير للبريد" data-fr="Envoyer le lien de réinitialisation">صيفط رابط التغيير للبريد</button>
      </form>
      <button class="link" data-back-login type="button" data-ar="الرجوع لتسجيل الدخول" data-fr="Retour à la connexion">الرجوع لتسجيل الدخول</button>
    </section>
    <section id="resetView" hidden>
      <h1 data-ar="اختار كلمة مرور جديدة" data-fr="Choisissez un nouveau mot de passe">اختار كلمة مرور جديدة</h1>
      <p class="intro" data-ar="الرابط صالح لمدة 15 دقيقة ولمرة واحدة." data-fr="Le lien est valable 15 minutes et ne peut être utilisé qu’une seule fois.">الرابط صالح لمدة 15 دقيقة ولمرة واحدة.</p>
      <form id="resetForm">
        <div class="field"><label for="newPassword" data-ar="كلمة المرور الجديدة (10 أحرف على الأقل)" data-fr="Nouveau mot de passe (10 caractères minimum)">كلمة المرور الجديدة (10 أحرف على الأقل)</label><input id="newPassword" name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></div>
        <div class="field"><label for="confirmPassword" data-ar="أكد كلمة المرور" data-fr="Confirmez le mot de passe">أكد كلمة المرور</label><input id="confirmPassword" name="confirmation" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></div>
        <button class="submit" type="submit" data-ar="بدل كلمة المرور" data-fr="Réinitialiser le mot de passe">بدل كلمة المرور</button>
      </form>
    </section>
    <p class="message" id="message" role="status" aria-live="polite"></p>
  </main>
  <script>
    const message = document.getElementById("message");
    const token = new URLSearchParams(location.search).get("reset");
    let language = "ar";

    function showView(name) {
      document.getElementById("loginView").hidden = name !== "login";
      document.getElementById("recoveryView").hidden = name !== "recovery";
      document.getElementById("resetView").hidden = name !== "reset";
      message.textContent = "";
      message.classList.remove("error");
    }

    function setLanguage(next) {
      language = next;
      document.documentElement.lang = next;
      document.documentElement.dir = next === "fr" ? "ltr" : "rtl";
      document.body.style.fontFamily = next === "fr" ? '"DM Sans", sans-serif' : '"Tajawal", sans-serif';
      document.querySelectorAll("[data-ar][data-fr]").forEach(element => { element.textContent = element.dataset[next]; });
      document.getElementById("languageToggle").textContent = next === "fr" ? "العربية" : "Français";
    }

    async function sendForm(url, payload) {
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || "تعذر إكمال الطلب.");
      return result;
    }

    document.getElementById("loginForm").addEventListener("submit", async event => {
      event.preventDefault();
      message.classList.remove("error");
      try {
        await sendForm("/api/auth/login", Object.fromEntries(new FormData(event.currentTarget)));
        location.replace("/admin.html");
      } catch (error) {
        message.textContent = error.message;
        message.classList.add("error");
      }
    });

    document.getElementById("showRecovery").addEventListener("click", () => showView("recovery"));
    document.querySelectorAll("[data-back-login]").forEach(button => button.addEventListener("click", () => showView("login")));
    document.getElementById("recoveryForm").addEventListener("submit", async event => {
      event.preventDefault();
      message.classList.remove("error");
      try {
        const result = await sendForm("/api/auth/recovery", Object.fromEntries(new FormData(event.currentTarget)));
        message.textContent = result.message;
      } catch (error) {
        message.textContent = error.message;
        message.classList.add("error");
      }
    });

    document.getElementById("resetForm").addEventListener("submit", async event => {
      event.preventDefault();
      message.classList.remove("error");
      try {
        const result = await sendForm("/api/auth/reset", {
          token,
          password: document.getElementById("newPassword").value,
          confirmation: document.getElementById("confirmPassword").value
        });
        showView("login");
        message.textContent = result.message;
        history.replaceState(null, "", "/admin-login.html");
      } catch (error) {
        message.textContent = error.message;
        message.classList.add("error");
      }
    });

    document.getElementById("languageToggle").addEventListener("click", () => setLanguage(language === "ar" ? "fr" : "ar"));
    if (token) showView("reset");
  </script>
</body>
</html>
